name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v6

      - name: Cache mise tools
        uses: actions/cache@v5
        with:
          path: ~/.local/share/mise
          key: mise-${{ hashFiles('mise.toml', '.tool-versions') }}
          restore-keys: |
            mise-

      - name: Cache Gleam deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/rebar3
            build
          key: ${{ runner.os }}-gleam-${{ hashFiles('manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-      

      - name: Install Mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $FORGEJO_PATH

      - name: Install Tools
        run: |
          mise install
          eval "$(mise activate bash --shims)" # Adds the activated tools to $PATH
        env:
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}

      - run: mise x -- gleam deps download
      - run: mise x -- gleam test
      - run: mise x -- gleam format --check src test
